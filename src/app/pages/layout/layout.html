<!-- ================= NAVBAR ================= -->
<nav class="navbar-wrapper">
  <div class="navbar-container">

    <!-- Logo -->
    <a routerLink="/" class="logo-wrapper">
      <span class="logo-title">
        HIRAYA
      </span>
      <span class="logo-subtitle">
        CAFE
      </span>
    </a>

    <!-- Desktop Navigation -->
    <div class="desktop-nav">
      <a
        routerLink="./"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        Home
      </a>

      <a
        routerLink="/menu"
        routerLinkActive="active-link"
        class="nav-link"
      >
        Menu
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active-link"
        class="nav-link"
      >
        About
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active-link"
        class="nav-link"
      >
        Contact
      </a>
    </div>

    <!-- Desktop View Menu Button & Mobile Hamburger Toggle -->
    <div class="nav-right-actions">
      <a
        routerLink="/menu"
        class="view-menu-btn desktop-only-btn"
      >
        VIEW MENU
      </a>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        (click)="isMobileMenuOpen = !isMobileMenuOpen"
        class="hamburger-btn"
        aria-label="Toggle Menu"
      >
        <span class="hamburger-line" [ngClass]="{'translate-y-2 rotate-45': isMobileMenuOpen}"></span>
        <span class="hamburger-line" [ngClass]="{'opacity-0': isMobileMenuOpen}"></span>
        <span class="hamburger-line" [ngClass]="{'-translate-y-2 -rotate-45': isMobileMenuOpen}"></span>
      </button>
    </div>

  </div>

  <!-- Mobile Dropdown Menu Drawer -->
  <div
    class="mobile-menu-drawer"
    [ngClass]="isMobileMenuOpen ? 'mobile-menu-open' : 'mobile-menu-closed'"
  >
    <div class="mobile-menu-content">
      <a
        routerLink="./"
        (click)="isMobileMenuOpen = false"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-nav-link"
      >
        Home
      </a>

      <a
        routerLink="/menu"
        (click)="isMobileMenuOpen = false"
        routerLinkActive="active-link"
        class="mobile-nav-link"
      >
        Menu
      </a>

      <a
        routerLink="/about"
        (click)="isMobileMenuOpen = false"
        routerLinkActive="active-link"
        class="mobile-nav-link"
      >
        About
      </a>

      <a
        routerLink="/contact"
        (click)="isMobileMenuOpen = false"
        routerLinkActive="active-link"
        class="mobile-nav-link"
      >
        Contact
      </a>

      <a
        routerLink="/menu"
        (click)="isMobileMenuOpen = false"
        class="view-menu-btn mobile-action-btn"
      >
        VIEW MENU
      </a>
    </div>
  </div>
</nav>


<!-- ================= PAGE CONTENT ================= -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>


<!-- ================= FOOTER ================= -->
<footer id="contact" class="footer-section">
  <div class="footer-container">
    <div>
      <p class="footer-logo">
        HIRAYA
      </p>
      <p class="footer-tagline">
        Brewed to inspire, made for you. ♡
      </p>
    </div>

    <p class="footer-copyright">
      © 2026 Hiraya Cafe. All Rights Reserved.
    </p>
  </div>
</footer>
