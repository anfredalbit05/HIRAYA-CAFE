<!-- ================= NAVBAR ================= -->
<nav class="navbar-wrapper" aria-label="Main navigation">
  <div class="navbar-container">

    <!-- Logo -->
    <a
      routerLink="/"
      class="logo-wrapper"
      aria-label="Hiraya Cafe home"
    >
      <span class="logo-title">HIRAYA</span>
      <span class="logo-subtitle">C A F E</span>
    </a>

    <!-- Desktop Navigation -->
    <div class="desktop-nav">
      <a
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        Home
      </a>

      <a
        routerLink="/menu"
        routerLinkActive="active-link"
        class="nav-link"
      >
        Menu
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active-link"
        class="nav-link"
      >
        About
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active-link"
        class="nav-link"
      >
        Contact
      </a>
    </div>

    <!-- Desktop Menu Button -->
    <div class="nav-right-actions">
      <a routerLink="/menu" class="view-menu-btn desktop-only-btn">
        <span>VIEW MENU</span>
      </a>
    </div>

  </div>
</nav>

<!-- ================= PAGE CONTENT ================= -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>

<!-- ================= MOBILE BOTTOM NAVIGATION ================= -->
<nav class="mobile-bottom-nav" aria-label="Mobile navigation">

  <!-- Home -->
  <a
    routerLink="/"
    routerLinkActive="bottom-nav-active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="bottom-nav-item"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m3 10 9-7 9 7"></path>
      <path d="M5 9v11h14V9"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
    <span>Home</span>
  </a>

  <!-- Menu -->
  <a
    routerLink="/menu"
    routerLinkActive="bottom-nav-active"
    class="bottom-nav-item"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 9h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V9Z"></path>
      <path d="M17 11h1a2.5 2.5 0 0 1 0 5h-2"></path>
      <path d="M8 5c0-1 1-1.5 1-2.5"></path>
      <path d="M12 5c0-1 1-1.5 1-2.5"></path>
    </svg>
    <span>Menu</span>
  </a>

  <!-- About -->
  <a
    routerLink="/about"
    routerLinkActive="bottom-nav-active"
    class="bottom-nav-item"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 11v5"></path>
      <path d="M12 8h.01"></path>
    </svg>
    <span>About</span>
  </a>

  <!-- Contact -->
  <a
    routerLink="/contact"
    routerLinkActive="bottom-nav-active"
    class="bottom-nav-item"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
      <path d="m3 7 9 6 9-6"></path>
    </svg>
    <span>Contact</span>
  </a>

</nav>

<!-- ================= FOOTER ================= -->
<footer class="footer-section">
  <div class="footer-container">

    <!-- Footer Brand -->
    <a
      routerLink="/"
      class="footer-brand"
      aria-label="Hiraya Cafe home"
    >
      <span class="footer-logo">HIRAYA</span>
      <span class="footer-brand-subtitle">C A F E</span>
    </a>

    <!-- Footer Description -->
    <div class="footer-center">
      <p class="footer-tagline">
        Brewed to inspire, made for you. ♡
      </p>

      <p class="footer-location">
        TAGUM CITY · DAVAO DEL NORTE
      </p>
    </div>

    <!-- Footer Copyright -->
    <div class="footer-bottom">
      <p class="footer-copyright">
        © 2026 Hiraya Cafe. All rights reserved.
      </p>
    </div>

  </div>
</footer>
